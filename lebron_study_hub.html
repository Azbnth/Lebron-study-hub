    <script type="text/babel">
        // Audio Synthesizer for Court & Game FX without external sound files
        const playSound = (type) => {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const now = ctx.currentTime;

                if (type === 'swish') {
                    // Swish sound effect (White noise sweep)
                    const bufferSize = ctx.sampleRate * 0.25;
                    const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
                    const data = buffer.getChannelData(0);
                    for (let i = 0; i < bufferSize; i++) {
                        data[i] = Math.random() * 2 - 1;
                    }
                    const noise = ctx.createBufferSource();
                    noise.buffer = buffer;
                    const filter = ctx.createBiquadFilter();
                    filter.type = 'bandpass';
                    filter.frequency.setValueAtTime(1200, now);
                    filter.frequency.exponentialRampToValueAtTime(300, now + 0.2);
                    filter.Q.value = 3;

                    const gain = ctx.createGain();
                    gain.gain.setValueAtTime(0.4, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);

                    noise.connect(filter);
                    filter.connect(gain);
                    gain.connect(ctx.destination);
                    noise.start(now);

                } else if (type === 'buzzer') {
                    // Arena Buzzer sound
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(140, now);
                    gain.gain.setValueAtTime(0.3, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.8);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start(now);
                    osc.stop(now + 0.8);

                } else if (type === 'correct') {
                    // Score chime
                    [523.25, 659.25, 783.99, 1046.50].forEach((freq, idx) => {
                        const osc = ctx.createOscillator();
                        const gain = ctx.createGain();
                        osc.type = 'sine';
                        osc.frequency.setValueAtTime(freq, now + idx * 0.08);
                        gain.gain.setValueAtTime(0.15, now + idx * 0.08);
                        gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.08 + 0.3);
                        osc.connect(gain);
                        gain.connect(ctx.destination);
                        osc.start(now + idx * 0.08);
                        osc.stop(now + idx * 0.08 + 0.3);
                    });

                } else if (type === 'bounce') {
                    // Ball bounce
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(180, now);
                    osc.frequency.exponentialRampToValueAtTime(60, now + 0.12);
                    gain.gain.setValueAtTime(0.3, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.12);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start(now);
                    osc.stop(now + 0.12);
                }
            } catch (e) {
                console.log("Audio API muted or non-interactive context");
            }
        };

        function ImportStudioView({ setDecks, setSelectedDeckId, setActiveTab, triggerSound }) {
            const [importMode, setImportMode] = React.useState('ai'); // 'ai' or 'manual'
            const [inputText, setInputText] = React.useState('');
            const [subjectCategory, setSubjectCategory] = React.useState('General Study');
            const [deckTitle, setDeckTitle] = React.useState('');
            const [isGenerating, setIsGenerating] = React.useState(false);
            const [statusMessage, setStatusMessage] = React.useState('');

            // AI Generation using Gemini API
            const handleAiGeneration = async () => {
                if (!inputText.trim()) {
                    setStatusMessage('Please paste or type study notes first!');
                    return;
                }

                setIsGenerating(true);
                setStatusMessage('Coach Bron is analyzing your notes and drafting cards...');

                try {
                    const apiKey = ""; // Canvas runtime injection
                    const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;

                    const systemInstruction = `You are LeBron James ("Coach Bron"), an elite academic mentor. Create a study deck containing 4 high-quality flashcards and 3 multiple-choice practice quiz questions based on the provided material. Respond strictly in valid JSON without markdown wrapping.`;

                    const promptText = `
                    Subject/Category: ${subjectCategory}
                    Title Suggestion: ${deckTitle || 'Custom Imported Deck'}
                    Study Notes:
                    ${inputText}

                    Return JSON matching this format:
                    {
                        "title": "Clear Deck Title",
                        "category": "${subjectCategory}",
                        "description": "Short summary of topic",
                        "cards": [
                            {
                                "id": "c1",
                                "question": "Key concept question?",
                                "answer": "Direct answer",
                                "explanation": "Detailed academic explanation",
                                "lebronTip": "A fun basketball/motivational analogy by LeBron James"
                            }
                        ],
                        "quiz": [
                            {
                                "id": "q1",
                                "question": "Question?",
                                "options": ["Option A", "Option B", "Option C", "Option D"],
                                "correctIndex": 0,
                                "explanation": "Why this option is correct"
                            }
                        ]
                    }
                    `;

                    const payload = {
                        contents: [{ parts: [{ text: promptText }] }],
                        systemInstruction: { parts: [{ text: systemInstruction }] },
                        generationConfig: {
                            responseMimeType: "application/json"
                        }
                    };

                    const response = await fetch(apiUrl, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });

                    const data = await response.json();
                    const jsonText = data?.candidates?.[0]?.content?.parts?.[0]?.text;

                    if (jsonText) {
                        const parsedDeck = JSON.parse(jsonText);
                        const newDeck = {
                            ...parsedDeck,
                            id: 'deck-' + Date.now()
                        };

                        setDecks(prev => [newDeck, ...prev]);
                        setSelectedDeckId(newDeck.id);
                        triggerSound('swish');
                        setActiveTab('flashcards');
                    } else {
                        throw new Error('Failed to parse Gemini output');
                    }

                } catch (err) {
                    console.error('AI Draft Error:', err);
                    setStatusMessage('Drafting fallback active: Generating structured deck locally...');
                    
                    // Fallback Deck Creator if offline or API limit
                    const fallbackDeck = {
                        id: 'deck-' + Date.now(),
                        title: deckTitle || 'Imported Notes Playbook',
                        category: subjectCategory,
                        description: 'Generated from imported text content.',
                        cards: [
                            {
                                id: 'fc1',
                                question: 'What is the main takeaway from your notes?',
                                answer: inputText.slice(0, 100) + '...',
                                explanation: 'Summary generated from provided material.',
                                lebronTip: 'Execution is key! Review this concept twice a day.'
                            },
                            {
                                id: 'fc2',
                                question: 'Define the core objective in this section.',
                                answer: 'Mastering the imported material.',
                                explanation: 'Detailed review recommended.',
                                lebronTip: 'Lock in on details like a clutch fourth quarter defense!'
                            }
                        ],
                        quiz: [
                            {
                                id: 'q1',
                                question: 'What subject is covered in this playbook?',
                                options: [subjectCategory, 'General Trivia', 'Uncategorized', 'Other'],
                                correctIndex: 0,
                                explanation: 'Matched your designated category.'
                            }
                        ]
                    };

                    setDecks(prev => [fallbackDeck, ...prev]);
                    setSelectedDeckId(fallbackDeck.id);
                    triggerSound('swish');
                    setActiveTab('flashcards');

                } finally {
                    setIsGenerating(false);
                }
            };

            return (
                <div class="max-w-3xl mx-auto bg-lakers-cardBg border border-lakers-border rounded-2xl p-6 md:p-8 space-y-6">
                    <div class="flex items-center justify-between border-b border-lakers-border pb-4">
                        <div class="flex items-center gap-3">
                            <div class="w-10 h-10 rounded-xl bg-lakers-gold/20 text-lakers-gold flex items-center justify-center font-bold">
                                ✨
                            </div>
                            <div>
                                <h3 class="text-xl font-bold text-white">Draft Studio</h3>
                                <p class="text-xs text-gray-400">Import your notes, articles, or topics to build flashcards & quizzes</p>
                            </div>
                        </div>

                        <div class="flex bg-lakers-darkBg rounded-xl p-1 border border-lakers-border">
                            <button 
                                onClick={() => setImportMode('ai')}
                                class={`px-3 py-1.5 text-xs font-bold rounded-lg transition ${importMode === 'ai' ? 'bg-lakers-purple text-lakers-gold' : 'text-gray-400'}`}
                            >
                                Coach AI Draft
                            </button>
                            <button 
                                onClick={() => setImportMode('manual')}
                                class={`px-3 py-1.5 text-xs font-bold rounded-lg transition ${importMode === 'manual' ? 'bg-lakers-purple text-lakers-gold' : 'text-gray-400'}`}
                            >
                                Quick Paste
                            </button>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-bold text-gray-300 uppercase tracking-wider mb-2">Playbook Title</label>
                            <input 
                                type="text"
                                value={deckTitle}
                                onChange={(e) => setDeckTitle(e.target.value)}
                                placeholder="e.g. History Chapter 4, Organic Chem 1"
                                class="w-full bg-lakers-darkBg border border-lakers-border rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-lakers-gold"
                            />
                        </div>

                        <div>
                            <label class="block text-xs font-bold text-gray-300 uppercase tracking-wider mb-2">Category / Subject</label>
                            <input 
                                type="text"
                                value={subjectCategory}
                                onChange={(e) => setSubjectCategory(e.target.value)}
                                placeholder="e.g. Science, Literature, Math"
                                class="w-full bg-lakers-darkBg border border-lakers-border rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-lakers-gold"
                            />
                        </div>
                    </div>

                    <div>
                        <label class="block text-xs font-bold text-gray-300 uppercase tracking-wider mb-2">
                            Paste Study Notes, Terms, or Raw Text
                        </label>
                        <textarea
                            rows="8"
                            value={inputText}
                            onChange={(e) => setInputText(e.target.value)}
                            placeholder="Paste your lecture notes, textbook excerpts, or list of terms here... Coach Bron will convert it into interactive flashcards and practice quiz questions automatically."
                            class="w-full bg-lakers-darkBg border border-lakers-border rounded-xl p-4 text-sm text-white focus:outline-none focus:border-lakers-gold resize-none"
                        ></textarea>
                    </div>

                    {statusMessage && (
                        <div class="p-3 bg-lakers-purple/30 border border-lakers-purple text-lakers-gold text-xs rounded-xl flex items-center gap-2">

                        </div>
                    )}

                    <div class="pt-2 flex items-center justify-end gap-3">
                        <button 
                            onClick={handleAiGeneration}
                            disabled={isGenerating}
                            class="w-full md:w-auto bg-gradient-to-r from-lakers-gold to-lakers-goldHover text-black font-bold text-sm px-6 py-3 rounded-xl flex items-center justify-center gap-2 shadow-lg hover:brightness-110 transition disabled:opacity-50"
                        >
                            {isGenerating ? (
                                <>
                                    <div class="w-4 h-4 border-2 border-black border-t-transparent rounded-full animate-spin"></div>
                                    <span>Drafting Playbook...</span>
                                </>
                            ) : (
                                <>
                                    <span>👑 Generate Playbook with AI</span>
                                </>
                            )}
                        </button>
                    </div>
                </div>
            );
        }

        function FlashcardArenaView({ deck, triggerSound }) {
            const [currentIndex, setCurrentIndex] = React.useState(0);
            const [isFlipped, setIsFlipped] = React.useState(false);
            const [masteredCards, setMasteredCards] = React.useState({});
            const [speaking, setSpeaking] = React.useState(false);

            if (!deck || !deck.cards || deck.cards.length === 0) {
                return (
                    <div class="text-center py-16 bg-lakers-cardBg rounded-2xl border border-lakers-border">
                        <p class="text-gray-400">No cards in this deck yet! Head to Draft Studio to generate cards.</p>
                    </div>
                );
            }

            const card = deck.cards[currentIndex];

            const handleNext = () => {
                setIsFlipped(false);
                setCurrentIndex((prev) => (prev + 1) % deck.cards.length);
                triggerSound('bounce');
            };

            const handlePrev = () => {
                setIsFlipped(false);
                setCurrentIndex((prev) => (prev - 1 + deck.cards.length) % deck.cards.length);
                triggerSound('bounce');
            };

            const toggleMastery = (cardId) => {
                setMasteredCards(prev => {
                    const updated = { ...prev, [cardId]: !prev[cardId] };
                    if (updated[cardId]) triggerSound('swish');
                    return updated;
                });
            };

            // Text to speech for card read-aloud
            const speakText = (text) => {
                if ('speechSynthesis' in window) {
                    window.speechSynthesis.cancel();
                    const utterance = new SpeechSynthesisUtterance(text);
                    utterance.rate = 0.95;
                    utterance.onend = () => setSpeaking(false);
                    setSpeaking(true);
                    window.speechSynthesis.speak(utterance);
                }
            };

            return (
                <div class="max-w-2xl mx-auto space-y-6">
                    {/* Top Progress & Controls */}
                    <div class="flex items-center justify-between text-sm text-gray-400">
                        <div class="flex items-center gap-2">
                            <span class="font-bold text-white">Card {currentIndex + 1}</span> of <span>{deck.cards.length}</span>
                        </div>
                        <div class="flex items-center gap-3">
                            <button 
                                onClick={() => speakText(`${card.question}. Answer: ${card.answer}`)}
                                class={`p-2 rounded-lg border transition ${speaking ? 'bg-lakers-gold text-black border-lakers-gold' : 'bg-lakers-cardBg border-lakers-border text-gray-300 hover:text-white'}`}
                                title="Read Card Aloud"
                            >
                                <i data-lucide="volume-2" class="w-4 h-4"></i>
                            </button>
                            <button 
                                onClick={() => toggleMastery(card.id)}
                                class={`px-3 py-1.5 rounded-lg border text-xs font-bold flex items-center gap-1.5 transition ${
                                    masteredCards[card.id] 
                                        ? 'bg-green-500/20 text-green-400 border-green-500/40' 
                                        : 'bg-lakers-cardBg text-gray-400 border-lakers-border hover:text-white'
                                }`}
                            >
                                <i data-lucide="check-circle-2" class="w-3.5 h-3.5"></i>
                                {masteredCards[card.id] ? 'Swish! Mastered' : 'Mark Mastered'}
                            </button>
                        </div>
                    </div>

                    {/* 3D Flip Flashcard */}
                    <div 
                        onClick={() => { setIsFlipped(!isFlipped); triggerSound('bounce'); }}
                        class="cursor-pointer perspective-1000 w-full min-h-[340px] relative"
                    >
                        <div class={`w-full h-full min-h-[340px] rounded-3xl transition-transform duration-500 transform-style-3d bg-lakers-cardBg border-2 ${isFlipped ? 'rotate-y-180 border-lakers-gold/60' : 'border-lakers-purple/80'} shadow-2xl p-6 md:p-8 flex flex-col justify-between`}>
                            
                            {/* Front Side (Question) */}
                            <div class={`w-full h-full flex flex-col justify-between ${isFlipped ? 'hidden' : 'block'}`}>
                                <div>
                                    <div class="flex items-center justify-between">
                                        <span class="text-xs font-bold uppercase tracking-wider text-lakers-gold bg-lakers-gold/10 px-3 py-1 rounded-full border border-lakers-gold/20">
                                            Question / Concept
                                        </span>
                                        <span class="text-xs text-gray-500">Click to Flip 🔄</span>
                                    </div>
                                    <h3 class="text-2xl md:text-3xl font-bold text-white mt-8 leading-snug">
                                        {card.question}
                                    </h3>
                                </div>
                                <div class="text-xs text-gray-400 text-center pt-6 border-t border-lakers-border/50">
                                    💡 Tap card to reveal answer & Coach Bron's breakdown
                                </div>
                            </div>

                            {/* Back Side (Answer & LeBron Tip) */}
                            <div class={`w-full h-full flex flex-col justify-between rotate-y-180 ${isFlipped ? 'block' : 'hidden'}`}>
                                <div>
                                    <div class="flex items-center justify-between">
                                        <span class="text-xs font-bold uppercase tracking-wider text-green-400 bg-green-500/10 px-3 py-1 rounded-full border border-green-500/20">
                                            Answer
                                        </span>
                                        <span class="text-xs text-gray-500">Click to Flip 🔄</span>
                                    </div>

                                    <h4 class="text-2xl font-bold text-lakers-gold mt-4">
                                        {card.answer}
                                    </h4>

                                    <p class="text-sm text-gray-300 mt-3 leading-relaxed">
                                        {card.explanation}
                                    </p>

                                    {card.lebronTip && (
                                        <div class="mt-5 p-3.5 bg-lakers-purple/30 border border-lakers-purple/60 rounded-xl flex items-start gap-3">
                                            <span class="text-xl">👑</span>
                                            <div>
                                                <p class="text-[11px] font-bold text-lakers-gold uppercase tracking-wider">Coach Bron's Playbook Tip</p>
                                                <p class="text-xs text-gray-200 mt-0.5">{card.lebronTip}</p>
                                            </div>
                                        </div>
                                    )}
                                </div>

                                <div class="text-xs text-gray-400 text-center pt-4 border-t border-lakers-border/50">
                                    Press Next to move to the next repetition
                                </div>
                            </div>

                        </div>
                    </div>

                    {/* Flashcard Navigation Bar */}
                    <div class="flex items-center justify-between gap-4">
                        <button 
                            onClick={handlePrev}
                            class="bg-lakers-cardBg border border-lakers-border hover:border-lakers-gold text-white font-bold px-5 py-3 rounded-xl text-sm transition flex items-center gap-2"
                        >
                            <i data-lucide="chevron-left" class="w-4 h-4"></i> Previous
                        </button>

                        <div class="flex items-center gap-1.5">
                            {deck.cards.map((c, idx) => (
                                <div 
                                    key={c.id} 
                                    class={`w-2.5 h-2.5 rounded-full transition-all ${idx === currentIndex ? 'w-6 bg-lakers-gold' : masteredCards[c.id] ? 'bg-green-500' : 'bg-lakers-border'}`}
                                ></div>
                            ))}
                        </div>

                        <button 
                            onClick={handleNext}
                            class="bg-lakers-gold hover:bg-lakers-goldHover text-black font-bold px-6 py-3 rounded-xl text-sm transition flex items-center gap-2 shadow-lg shadow-lakers-gold/20"
                        >
                            Next <i data-lucide="chevron-right" class="w-4 h-4"></i>
                        </button>
                    </div>
                </div>
            );
        }

        function QuizGameView({ deck, triggerSound, setRings }) {
            const [currentQIndex, setCurrentQIndex] = React.useState(0);
            const [selectedOption, setSelectedOption] = React.useState(null);
            const [score, setScore] = React.useState(0);
            const [quizFinished, setQuizFinished] = React.useState(false);
            const [answersSummary, setAnswersSummary] = React.useState([]);

            if (!deck || !deck.quiz || deck.quiz.length === 0) {
                return (
                    <div class="text-center py-16 bg-lakers-cardBg rounded-2xl border border-lakers-border">
                        <p class="text-gray-400">No practice quiz questions in this deck yet. Use Draft Studio to create some!</p>
                    </div>
                );
            }

            const currentQ = deck.quiz[currentQIndex];

            const handleOptionSelect = (optionIndex) => {
                if (selectedOption !== null) return; // Prevent double taps

                setSelectedOption(optionIndex);
                const isCorrect = optionIndex === currentQ.correctIndex;

                if (isCorrect) {
                    setScore(prev => prev + 1);
                    triggerSound('correct');
                } else {
                    triggerSound('buzzer');
                }

                setAnswersSummary(prev => [
                    ...prev,
                    { question: currentQ.question, selected: optionIndex, correct: currentQ.correctIndex, isCorrect }
                ]);
            };

            const handleNextQuestion = () => {
                if (currentQIndex + 1 < deck.quiz.length) {
                    setCurrentQIndex(prev => prev + 1);
                    setSelectedOption(null);
                } else {
                    setQuizFinished(true);
                    triggerSound('swish');
                    // Check if high score awards championship ring
                    if ((score / deck.quiz.length) >= 0.8) {
                        if (window.confetti) window.confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
                        setRings(prev => Array.from(new Set([...prev, `${deck.title} Champion Ring`])));
                    }
                }
            };

            const resetQuiz = () => {
                setCurrentQIndex(0);
                setSelectedOption(null);
                setScore(0);
                setQuizFinished(false);
                setAnswersSummary([]);
            };

            return (
                <div class="max-w-2xl mx-auto space-y-6">
                    {/* Arena Scoreboard Header */}
                    <div class="bg-lakers-darkBg border border-lakers-border rounded-2xl p-4 flex items-center justify-between text-center">
                        <div class="text-left">
                            <span class="text-[10px] font-bold text-gray-400 uppercase tracking-widest">GAME DAY PRACTICE</span>
                            <h4 class="text-sm font-bold text-white">{deck.title}</h4>
                        </div>
                        <div class="flex items-center gap-6">
                            <div>
                                <span class="text-[10px] text-gray-400 font-bold block">SCORE</span>
                                <span class="font-display text-2xl font-bold text-lakers-gold">{score} / {deck.quiz.length}</span>
                            </div>
                            <div>
                                <span class="text-[10px] text-gray-400 font-bold block">SHOTS</span>
                                <span class="font-display text-2xl font-bold text-white">{currentQIndex + 1}/{deck.quiz.length}</span>
                            </div>
                        </div>
                    </div>

                    {!quizFinished ? (
                        <div class="bg-lakers-cardBg border border-lakers-border rounded-2xl p-6 md:p-8 space-y-6 shadow-xl">
                            <div>
                                <span class="text-xs font-bold text-lakers-gold uppercase tracking-wider">Question {currentQIndex + 1}</span>
                                <h3 class="text-xl md:text-2xl font-bold text-white mt-2">
                                    {currentQ.question}
                                </h3>
                            </div>

                            {/* Options */}
                            <div class="space-y-3">
                                {currentQ.options.map((opt, idx) => {
                                    let btnStyle = "bg-lakers-darkBg border-lakers-border text-gray-200 hover:border-lakers-gold/50";
                                    
                                    if (selectedOption !== null) {
                                        if (idx === currentQ.correctIndex) {
                                            btnStyle = "bg-green-500/20 border-green-500 text-green-300 font-bold";
                                        } else if (idx === selectedOption) {
                                            btnStyle = "bg-red-500/20 border-red-500 text-red-300";
                                        } else {
                                            btnStyle = "bg-lakers-darkBg border-lakers-border text-gray-500 opacity-50";
                                        }
                                    }

                                    return (
                                        <button
                                            key={idx}
                                            onClick={() => handleOptionSelect(idx)}
                                            disabled={selectedOption !== null}
                                            class={`w-full text-left p-4 rounded-xl border text-sm font-medium transition duration-200 flex items-center justify-between ${btnStyle}`}
                                        >
                                            <span>{opt}</span>
                                            {selectedOption !== null && idx === currentQ.correctIndex && (
                                                <span class="text-green-400 font-bold text-xs">SWISH ✓</span>
                                            )}
                                        </button>
                                    );
                                })}
                            </div>

                            {/* Explanation Feedback */}
                            {selectedOption !== null && (
                                <div class="p-4 bg-lakers-purple/30 border border-lakers-purple rounded-xl text-xs space-y-1">
                                    <p class="font-bold text-lakers-gold uppercase">Coach Playbook Breakdown:</p>
                                    <p class="text-gray-300">{currentQ.explanation}</p>
                                </div>
                            )}

                            {/* Continue Button */}
                            {selectedOption !== null && (
                                <div class="pt-2 flex justify-end">
                                    <button
                                        onClick={handleNextQuestion}
                                        class="bg-lakers-gold hover:bg-lakers-goldHover text-black font-bold px-6 py-3 rounded-xl text-sm transition flex items-center gap-2 shadow-lg shadow-lakers-gold/20"
                                    >
                                        {currentQIndex + 1 < deck.quiz.length ? 'Next Question ➡️' : 'View Game Box Score 🏆'}
                                    </button>
                                </div>
                            )}
                        </div>
                    ) : (
                        /* Quiz Finished Box Score */
                        <div class="bg-lakers-cardBg border border-lakers-border rounded-2xl p-6 md:p-8 text-center space-y-6">
                            <div class="w-16 h-16 mx-auto rounded-full bg-lakers-gold/20 border border-lakers-gold/40 flex items-center justify-center text-3xl">
                                {(score / deck.quiz.length) >= 0.8 ? '🏆' : '🏀'}
                            </div>

                            <div>
                                <h3 class="text-2xl font-bold text-white">Final Box Score</h3>
                                <p class="text-sm text-gray-400 mt-1">
                                    Field Goal Percentage: <span class="font-bold text-lakers-gold">{Math.round((score / deck.quiz.length) * 100)}%</span>
                                </p>
                            </div>

                            <div class="p-4 bg-lakers-darkBg rounded-xl border border-lakers-border text-left space-y-2">
                                <p class="text-xs font-bold text-gray-400 uppercase">Coach Bron's Post-Game Review:</p>
                                <p class="text-sm text-gray-300">
                                    {(score / deck.quiz.length) >= 0.8 
                                        ? "Championship performance! You dominated the floor on this subject. Keep pushing for back-to-back titles!" 
                                        : "Good effort out there! Go back to the flashcards for another practice session before game day."}
                                </p>
                            </div>

                            <div class="flex items-center justify-center gap-4">
                                <button
                                    onClick={resetQuiz}
                                    class="bg-lakers-gold text-black font-bold px-6 py-3 rounded-xl text-sm hover:bg-lakers-goldHover transition"
                                >
                                    Replay Quiz
                                </button>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        function CoachBronAiView({ deck, triggerSound }) {
            const [messages, setMessages] = React.useState([
                {
                    role: 'assistant',
                    text: `What's good, Champ! I'm Coach Bron. I'm locked in and ready to break down any topic from "${deck.title}" or whatever concept you're tackling today. Ask me for a basketball analogy, a game plan summary, or a quick pop quiz!`
                }
            ]);
            const [inputText, setInputText] = React.useState('');
            const [isLoading, setIsLoading] = React.useState(false);
            const chatEndRef = React.useRef(null);

            React.useEffect(() => {
                chatEndRef.current?.scrollIntoView({ behavior: 'smooth' });
            }, [messages]);

            const sendMessage = async (customPrompt) => {
                const query = customPrompt || inputText;
                if (!query.trim()) return;

                const userMsg = { role: 'user', text: query };
                setMessages(prev => [...prev, userMsg]);
                if (!customPrompt) setInputText('');
                setIsLoading(true);

                try {
                    const apiKey = "";
                    const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;

                    const systemInstruction = `You are 'Coach Bron' (LeBron James as an enthusiastic, hyper-encouraging, brilliant academic mentor). 
                    Speak like LeBron James: use basketball analogies, call the student 'Champ', 'Teammate', or 'Young King/Queen', and break down complex concepts into simple step-by-step 'game plans'. 
                    Maintain high energy, leadership, and absolute academic clarity. Context deck title: ${deck.title}.`;

                    const chatHistory = messages.map(m => ({
                        role: m.role === 'assistant' ? 'model' : 'user',
                        parts: [{ text: m.text }]
                    }));
                    chatHistory.push({ role: 'user', parts: [{ text: query }] });

                    const payload = {
                        contents: chatHistory,
                        systemInstruction: { parts: [{ text: systemInstruction }] }
                    };

                    const response = await fetch(apiUrl, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });

                    const data = await response.json();
                    const replyText = data?.candidates?.[0]?.content?.parts?.[0]?.text || "Listen man, we had a temporary timeout on the server! Let's run that play again.";

                    setMessages(prev => [...prev, { role: 'assistant', text: replyText }]);
                    triggerSound('bounce');

                } catch (err) {
                    console.error('Coach Bron Chat Error:', err);
                    setMessages(prev => [...prev, {
                        role: 'assistant',
                        text: "Great effort on that play! Remember: Consistency is everything. Focus on mastering the key terms step by step."
                    }]);
                } finally {
                    setIsLoading(false);
                }
            };

            return (
                <div class="max-w-3xl mx-auto h-[600px] bg-lakers-cardBg border border-lakers-border rounded-2xl flex flex-col overflow-hidden shadow-2xl">
                    {/* Header */}
                    <div class="bg-lakers-darkBg border-b border-lakers-border p-4 flex items-center gap-3">
                        <div class="w-10 h-10 rounded-full bg-gradient-to-tr from-lakers-purple to-lakers-gold flex items-center justify-center font-bold text-lg crown-glow">
                            👑
                        </div>
                        <div>
                            <h3 class="text-sm font-bold text-white flex items-center gap-2">
                                Coach Bron AI <span class="w-2 h-2 rounded-full bg-green-400 inline-block animate-ping"></span>
                            </h3>
                            <p class="text-xs text-lakers-gold">24/7 AI Study Mentor & Game Strategist</p>
                        </div>
                    </div>

                    {/* Messages Body */}
                    <div class="flex-1 p-4 overflow-y-auto space-y-4">
                        {messages.map((m, idx) => (
                            <div key={idx} class={`flex ${m.role === 'user' ? 'justify-end' : 'justify-start'}`}>
                                <div class={`max-w-[85%] rounded-2xl p-4 text-sm leading-relaxed ${
                                    m.role === 'user' 
                                        ? 'bg-lakers-purple text-white rounded-br-none border border-lakers-purple' 
                                        : 'bg-lakers-darkBg text-gray-200 border border-lakers-border rounded-bl-none'
                                }`}>
                                    {m.role === 'assistant' && (
                                        <p class="text-[10px] font-bold text-lakers-gold mb-1 uppercase tracking-wider">Coach Bron 🏀</p>
                                    )}
                                    <p class="whitespace-pre-wrap">{m.text}</p>
                                </div>
                            </div>
                        ))}
                        {isLoading && (
                            <div class="flex justify-start">
                                <div class="bg-lakers-darkBg border border-lakers-border rounded-2xl p-3 text-xs text-lakers-gold flex items-center gap-2">
                                    <div class="w-2 h-2 bg-lakers-gold rounded-full animate-bounce"></div>
                                    <span>Coach Bron is drawing up the playbook...</span>
                                </div>
                            </div>
                        )}
                        <div ref={chatEndRef}></div>
                    </div>

                    {/* Quick Action Prompt Pills */}
                    <div class="p-2 bg-lakers-darkBg/60 border-t border-lakers-border/50 flex items-center gap-2 overflow-x-auto text-xs">
                        <button 
                            onClick={() => sendMessage("Give me a basketball analogy for this deck topic!")}
                            class="bg-lakers-cardBg border border-lakers-border text-gray-300 hover:text-white px-3 py-1.5 rounded-full shrink-0"
                        >
                            🏀 Basketball Analogy
                        </button>
                        <button 
                            onClick={() => sendMessage("Give me a pre-game motivational pep talk!")}
                            class="bg-lakers-cardBg border border-lakers-border text-gray-300 hover:text-white px-3 py-1.5 rounded-full shrink-0"
                        >
                            🔥 Pre-game Pep Talk
                        </button>
                        <button 
                            onClick={() => sendMessage("Test me on a hard question from this subject right now.")}
                            class="bg-lakers-cardBg border border-lakers-border text-gray-300 hover:text-white px-3 py-1.5 rounded-full shrink-0"
                        >
                            🎯 Pop Quiz Me
                        </button>
                    </div>

                    {/* Input Field */}
                    <div class="p-3 bg-lakers-darkBg border-t border-lakers-border flex items-center gap-2">
                        <input 
                            type="text"
                            value={inputText}
                            onChange={(e) => setInputText(e.target.value)}
                            onKeyDown={(e) => e.key === 'Enter' && sendMessage()}
                            placeholder="Ask Coach Bron anything about your study notes..."
                            class="flex-1 bg-lakers-cardBg border border-lakers-border rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-lakers-gold"
                        />
                        <button 
                            onClick={() => sendMessage()}
                            disabled={isLoading}
                            class="bg-lakers-gold hover:bg-lakers-goldHover text-black p-2.5 rounded-xl font-bold transition disabled:opacity-50"
                        >
                            <i data-lucide="send" class="w-4 h-4"></i>
                        </button>
                    </div>
                </div>
            );
        }

        function TimerClutchView({ triggerSound }) {
            const [timeLeft, setTimeLeft] = React.useState(25 * 60);
            const [isRunning, setIsRunning] = React.useState(false);
            const [mode, setMode] = React.useState('focus'); // 'focus' (25m) or 'break' (5m)

            React.useEffect(() => {
                let timer;
                if (isRunning && timeLeft > 0) {
                    timer = setInterval(() => setTimeLeft(prev => prev - 1), 1000);
                } else if (timeLeft === 0) {
                    triggerSound('buzzer');
                    setIsRunning(false);
                }
                return () => clearInterval(timer);
            }, [isRunning, timeLeft]);

            const toggleTimer = () => {
                setIsRunning(!isRunning);
                triggerSound('bounce');
            };

            const resetTimer = (newMinutes, newMode) => {
                setIsRunning(false);
                setMode(newMode);
                setTimeLeft(newMinutes * 60);
                triggerSound('bounce');
            };

            const formatTime = (seconds) => {
                const m = Math.floor(seconds / 60);
                const s = seconds % 60;
                return `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
            };

            const totalDuration = mode === 'focus' ? 25 * 60 : 5 * 60;
            const progress = ((totalDuration - timeLeft) / totalDuration) * 100;

            return (
                <div class="max-w-xl mx-auto bg-lakers-cardBg border border-lakers-border rounded-2xl p-8 text-center space-y-6 shadow-2xl">
                    <div class="flex justify-center gap-2 bg-lakers-darkBg p-1 rounded-xl w-fit mx-auto border border-lakers-border">
                        <button 
                            onClick={() => resetTimer(25, 'focus')}
                            class={`px-4 py-2 rounded-lg text-xs font-bold transition ${mode === 'focus' ? 'bg-lakers-purple text-lakers-gold' : 'text-gray-400'}`}
                        >
                            25M Clutch Focus
                        </button>
                        <button 
                            onClick={() => resetTimer(5, 'break')}
                            class={`px-4 py-2 rounded-lg text-xs font-bold transition ${mode === 'break' ? 'bg-lakers-purple text-lakers-gold' : 'text-gray-400'}`}
                        >
                            5M Timeout Break
                        </button>
                    </div>

                    {/* Timer Clock Circle */}
                    <div class="relative w-64 h-64 mx-auto flex items-center justify-center">
                        <svg class="w-full h-full transform -rotate-90">
                            <circle cx="128" cy="128" r="110" stroke="currentColor" stroke-width="10" class="text-lakers-darkBg" fill="transparent" />
                            <circle 
                                cx="128" 
                                cy="128" 
                                r="110" 
                                stroke="currentColor" 
                                stroke-width="10" 
                                stroke-dasharray={690}
                                stroke-dashoffset={690 - (690 * progress) / 100}
                                stroke-linecap="round"
                                class="text-lakers-gold transition-all duration-1000" 
                                fill="transparent" 
                            />
                        </svg>
                        <div class="absolute flex flex-col items-center">
                            <span class="font-display text-6xl font-bold text-white tracking-widest">{formatTime(timeLeft)}</span>
                            <span class="text-xs uppercase font-bold text-lakers-gold mt-1">
                                {mode === 'focus' ? '🏀 4th Quarter Lock In' : '🥤 Bench Timeout'}
                            </span>
                        </div>
                    </div>

                    {/* Control Buttons */}
                    <div class="flex items-center justify-center gap-4">
                        <button 
                            onClick={toggleTimer}
                            class="bg-lakers-gold hover:bg-lakers-goldHover text-black font-bold px-8 py-3.5 rounded-xl text-base transition shadow-lg shadow-lakers-gold/20"
                        >
                            {isRunning ? 'Pause Clock ⏱️' : 'Start Clutch Time 🚀'}
                        </button>
                        <button 
                            onClick={() => resetTimer(mode === 'focus' ? 25 : 5, mode)}
                            class="bg-lakers-darkBg border border-lakers-border text-gray-300 hover:text-white px-5 py-3.5 rounded-xl text-sm font-bold transition"
                        >
                            Reset
                        </button>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<LeBronApp />);
    </script>
</body>
</html>
